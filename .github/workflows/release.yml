name: Release

# Push a tag that matches manifest.json, for example:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches manifest.json
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "v$MANIFEST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$MANIFEST_VERSION"
            exit 1
          fi

      - name: Run tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:unit
          xvfb-run -a npm run test:e2e

      - name: Build the extension zip
        run: npm run package

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[?"v"\\]?" {found=1; next}
            found && /^## / {exit}
            found {print}' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "dist/price-watch-$GITHUB_REF_NAME.zip" \
            --title "Price Watch $GITHUB_REF_NAME" \
            --notes "${NOTES:-See CHANGELOG.md}"
