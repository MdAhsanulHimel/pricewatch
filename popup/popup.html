<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Price Watch</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="../icons/icon32.png" width="18" height="18" alt="">
      <span>Price Watch</span>
    </div>
    <div class="hactions">
      <button id="checkAll" class="ghost" title="Check every item now">Check all</button>
      <button id="csv" class="icon" title="Download the price database (CSV)">&#8681;</button>
      <button id="openOptions" class="icon" title="Settings">&#9881;</button>
    </div>
  </header>

  <div id="addbar">
    <button id="pick" class="primary wide">Track a price on this page</button>
    <div id="addnote" class="note"></div>
  </div>

  <div id="list"></div>

  <div id="empty" class="empty" hidden>
    <p><strong>Nothing tracked yet.</strong></p>
    <p>Open a product page, press the button above, then click the price.
       Price Watch checks it on a schedule and tells you when it moves.</p>
  </div>

  <footer>
    <span id="status"></span>
  </footer>

  <template id="row-tpl">
    <div class="item">
      <div class="top">
        <div class="label"></div>
        <button class="icon menu" title="More">&#8942;</button>
      </div>
      <div class="mid">
        <div class="price"></div>
        <div class="delta"></div>
        <svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none"></svg>
      </div>
      <div class="meta"></div>
      <div class="err" hidden></div>
      <div class="drawer" hidden>
        <div class="targetrow">
          <label><input type="checkbox" class="tgt-on"> Alert when</label>
          <select class="tgt-dir">
            <option value="below">at or below</option>
            <option value="above">at or above</option>
          </select>
          <input type="number" class="tgt-val" step="any" placeholder="value">
        </div>
        <div class="targetrow">
          <label>Check every</label>
          <select class="int-sel">
            <option value="">default</option>
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="60">1 hour</option>
            <option value="180">3 hours</option>
            <option value="360">6 hours</option>
            <option value="720">12 hours</option>
            <option value="1440">1 day</option>
          </select>
        </div>
        <div class="drawer-actions">
          <button class="ghost act-check">Check now</button>
          <button class="ghost act-repick" title="Pick the price again on the page. History is kept.">Re-pick</button>
          <button class="ghost act-open">Open page</button>
          <button class="ghost act-pause">Pause</button>
          <button class="ghost act-reauth" hidden>Re-authorise</button>
          <button class="ghost danger act-del">Remove</button>
        </div>
      </div>
    </div>
  </template>

  <script src="../lib/pw-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
